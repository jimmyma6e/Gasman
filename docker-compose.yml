services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gasman
      POSTGRES_USER: gasman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasman}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tunnel

  gasman:
    image: gasman:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gasman:${POSTGRES_PASSWORD:-gasman}@db/gasman
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tunnel

volumes:
  db_data:

networks:
  tunnel:
    external: true
    name: household-budget_default
