services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gasman
      POSTGRES_USER: gasman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gasman}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gasman"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tunnel

  gasman:
    image: gasman:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gasman:${POSTGRES_PASSWORD:-gasman}@db/gasman
      # Gmail SMTP for price-alert emails — set these in a `.env` file next
      # to this compose file (gitignored, never committed). Generate an App
      # Password at myaccount.google.com/apppasswords; a regular Gmail
      # password will not work here.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      ALERT_FROM_EMAIL: ${ALERT_FROM_EMAIL:-${SMTP_USER:-}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tunnel

volumes:
  db_data:

networks:
  tunnel:
    external: true
    name: household-budget_default
